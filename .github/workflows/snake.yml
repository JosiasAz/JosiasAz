name: Generate Snake & Pac-Man

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pac-Man primeiro: o snk roda em Docker como root e deixaria dist/ sem permissão de escrita
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: JosiasAz
          games: pacman

      - uses: Platane/snk@v3
        with:
          github_user_name: JosiasAz
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Alterna a animação exibida no README a cada 12h: cobra, depois Pac-Man
      - name: Choose animation
        run: |
          ls dist
          if [ $(( $(date -u +%s) / 43200 % 2 )) -eq 0 ]; then
            cp dist/github-contribution-grid-snake-dark.svg dist/game-dark.svg
          else
            cp dist/pacman-contribution-graph-dark.svg dist/game-dark.svg
          fi

      - name: Push animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
