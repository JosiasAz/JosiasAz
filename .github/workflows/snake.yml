name: Generate Snake & Pac-Man

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pac-Man primeiro: o snk roda em Docker como root e deixaria dist/ sem permissão de escrita
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: JosiasAz
          games: pacman

      - uses: Platane/snk@v3
        with:
          github_user_name: JosiasAz
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Junta as duas num SVG só: a cobra toca inteira, depois o Pac-Man, e repete
      - name: Combine animations
        run: |
          node .github/scripts/combine-games.js \
            dist/github-contribution-grid-snake-dark.svg \
            dist/pacman-contribution-graph-dark.svg \
            dist/game-dark.svg

      - name: Push animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
